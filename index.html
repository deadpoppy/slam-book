<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>从 SLAM 到空间智能</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a1a; }
    iframe { width: 100%; height: 100%; border: none; }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #1a1a1a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      z-index: 10;
    }
    #loading p { margin: 8px 0; font-size: 14px; color: #aaa; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #ff8c69;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>正在加载《从 SLAM 到空间智能》...</p>
    <p style="font-size:12px;color:#666;">首次加载可能需要几秒钟</p>
  </div>
  <iframe id="viewer" src="web/viewer.html?file=../slam2embody.pdf#pagemode=bookmarks" allowfullscreen></iframe>
  <script>
    const iframe = document.getElementById('viewer');
    iframe.onload = () => { document.getElementById('loading').style.display = 'none'; };
  </script>
</body>
</html>
